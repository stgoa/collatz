# Compiles the Lean files that build against Mathlib alone.
# NOTE: this workflow has never been run. It is adapted from the legacy workflow of the same name;
# expect to fix it on its first run.
# Dichotomy.lean and PairObligation.lean are left out: they import Solution.Basic from the external
# AxiomMath/CollatzPositiveDensity project, which is not a dependency of lean/lakefile.toml (see lean/README.md).
# V004_Final.lean and ReverseClosure_Final.lean are parts concatenated into the *_Assembly.lean files.
name: lean

on:
  pull_request:
    paths: ["lean/**", ".github/workflows/lean.yml"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: compile the Mathlib-only Lean files
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
      - name: install elan
        run: |
          curl -sSfL https://raw.githubusercontent.com/leanprover/elan/master/elan-init.sh | sh -s -- -y --default-toolchain none
          echo "$HOME/.elan/bin" >> "$GITHUB_PATH"
      - name: fetch Mathlib (prebuilt cache for the pinned commit)
        working-directory: lean
        run: lake exe cache get
      - name: assemblies are up to date
        working-directory: lean
        run: |
          sh build_reverse_assembly.sh
          git diff --exit-code -- V004_Assembly.lean ReverseClosure_Assembly.lean
      - name: compile
        working-directory: lean
        run: |
          for f in PeriodicRigidity GeneralPeriodic OddEventuallyPeriodic KernelClosure V004_Assembly \
                   ScalarInterface QuadraticSeparation ReverseClosure_Assembly DoubledWords CycleSpectrum; do
            echo "::group::$f"; lake env lean "$f.lean"; echo "::endgroup::"
          done
